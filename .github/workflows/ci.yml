name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  frontend:
    name: Frontend (typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsgo --noEmit
      - name: Unit tests (calculator, quote)
        run: bunx vitest run
      - name: Production build
        run: bun run build

  backend:
    name: Backend (prisma, typecheck, build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: paycrivo
          POSTGRES_PASSWORD: paycrivo
          POSTGRES_DB: paycrivo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U paycrivo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://paycrivo:paycrivo@localhost:5432/paycrivo_test
      JWT_CUSTOMER_SECRET: ci-customer-secret
      JWT_ADMIN_SECRET: ci-admin-secret
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install
        run: npm ci
      - name: Prisma generate
        run: npx prisma generate
      - name: Prisma validate
        run: npx prisma validate
      - name: Prisma migrate deploy (throwaway DB)
        run: npx prisma migrate deploy
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build